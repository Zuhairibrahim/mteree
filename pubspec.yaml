name: shelat
description: Shelat 2026 Offline
publish_to: "none"
version: 1.0.0+99

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  shared_preferences: ^2.2.3
  just_audio: ^0.9.38
  google_mobile_ads: ^5.2.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2
  google_play_api_kit: ^0.2.6
  flutter_native_splash: ^2.4.7


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/logo.jpg
    - assets/images/
    - assets/videos/
# -------- App Icon (Android only) --------
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.jpg"

  # ✅ يخلي الأيقونة Adaptive (النظام غالبًا يعرضها بشكل دائري)
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/logo.jpg"
  min_sdk_android: 21

# -------- Splash Screen (Android only) --------
flutter_native_splash:
  android: true
  ios: false
  color: "#000000"
  image: assets/images/logo.jpg
  android_12:
    color: "#000000"
    image: assets/images/logo.jpg
